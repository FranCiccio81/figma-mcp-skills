# Alembic — configuration Boussole.
# Usage : depuis boussole/api : alembic -c alembic/alembic.ini upgrade head
# L'URL de base vient de DATABASE_URL (voir env.py) — jamais committée (D23).

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# URL volontairement vide : env.py lit app.core.config.Settings (DATABASE_URL).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
