# Boussole — déploiement sur un VPS (root SSH + Docker).
#
# Différences ASSUMÉES avec `docker-compose.dev.yml`, et chacune répare un
# défaut que le fichier de développement aurait emporté en production :
#
# - **plus de mailpit.** En dev il avale tous les messages ; déployé tel quel,
#   personne ne recevrait jamais un e-mail et rien ne le signalerait. La
#   production vise un vrai SMTP (`SMTP_HOST`), et `SMTP_STARTTLS=false`
#   empêche le démarrage (§2.4 ter du runbook) ;
# - **plus de MinIO.** Le stockage objet est externe : voir le commentaire de
#   `S3_ENDPOINT` dans `.env.production.example`. `S3_SSE=none` est refusé au
#   démarrage, et MinIO sans KES ne sait pas chiffrer côté serveur ;
# - **plus de corpus de démonstration** (`FEATURE_SOURCE_DEMO`) : le
#   connecteur refuse de toute façon de s'activer hors développement ;
# - **un seul service publie des ports** : `caddy`. Ni `web`, ni `api`, ni la
#   base ne sont joignables depuis l'extérieur. Ce n'est pas de la prudence
#   décorative : c'est ce qui rend le `X-Forwarded-For` posé par Caddy
#   réellement infalsifiable (voir `Caddyfile`) ;
# - **des sondes partout**, y compris sur `worker` et `beat` — un
#   ordonnanceur mort est silencieux, et c'est lui qui exécute les purges RGPD.
#
# Toutes les valeurs sensibles viennent de `.env` (voir
# `.env.production.example`). Aucun secret dans ce fichier.
#
#     docker compose -f infra/docker-compose.prod.yml --env-file .env up -d
name: boussole

x-app-env: &app-env
  ENV: production
  DEBUG: "false"
  DATABASE_URL: postgresql+asyncpg://boussole:${POSTGRES_PASSWORD}@postgres:5432/boussole
  REDIS_PERSISTENT_URL: redis://redis-persistent:6379/0
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  PRIVACY_SIGNING_KEY: ${PRIVACY_SIGNING_KEY}
  STORAGE_BACKEND: s3
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_SSE: ${S3_SSE:-AES256}
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-virtual}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: "true"
  MAIL_FROM: ${MAIL_FROM}
  SENTRY_DSN: ${SENTRY_DSN:-}
  AI_PROVIDER: ${AI_PROVIDER:-fake}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SESSION_TTL_DAYS: "30"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: boussole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: boussole
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # `max_connections` : chaque worker uvicorn ouvre son propre pool
    # (5 + 10 de débordement), et les workers Celery ont le leur. Voir §5.5
    # du runbook — c'est la contrainte qui borne `WEB_CONCURRENCY`.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boussole -d boussole"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-persistent:
    image: redis:7-alpine
    # Sessions ET broker Celery : une éviction détruirait des sessions ou des
    # messages de file. AOF activé, aucune éviction (D17).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-persistent-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    # Cache, limitation de débit, quotas : la perte est acceptable (D17), et
    # `/readyz` ne la compte pas comme vitale — une panne ici dégrade, elle
    # ne coupe pas.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      <<: *app-env
      # Le SEUL proxy de confiance est le conteneur `web`, épinglé ci-dessous.
      # L'API lit alors le DERNIER saut non fiable de la chaîne — l'adresse
      # réelle du client, posée par Caddy.
      FORWARDED_ALLOW_IPS: "172.29.0.20"
      # Capacité mesurée : ~15 req/s et ~5 utilisateurs simultanés par
      # processus (runbook §5.5). À dimensionner, sans oublier
      # `POSTGRES_MAX_CONNECTIONS`.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - -Q
      - ingestion,ai,scoring,maintenance
      - --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ⚠️ EXACTEMENT UNE INSTANCE. Deux beats sur le même broker dupliquent
  # chaque tâche planifiée — purges RGPD comprises. Ne pas mettre à l'échelle.
  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command:
      - celery
      - -A
      - app.workers.celery_app
      - beat
      - --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test $$(find /tmp -maxdepth 1 -name 'boussole-celerybeat-schedule*' -mmin -120 | wc -l) -gt 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      API_INTERNAL_URL: http://api:8000
      # Déclare que Caddy pose `X-Forwarded-For` de façon autoritaire (il
      # l'ÉCRASE) et que `web` n'est joignable que par lui. Sans cette
      # déclaration, le BFF ne transmet pas l'en-tête et toute la limitation
      # de débit anonyme retombe sur un seau unique. Voir la docstring de
      # `web/app/api/[...path]/route.ts`.
      TRUSTED_EDGE: "true"
    # Adresse FIXE : c'est elle que l'API accepte comme proxy de confiance.
    # Aucun port publié — `web` n'est joignable que par Caddy.
    networks:
      default:
        ipv4_address: 172.29.0.20
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Le SEUL service exposé. TLS automatique et bordure de confiance pour
  # `X-Forwarded-For` — voir `Caddyfile`.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  redis-persistent-data:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16
