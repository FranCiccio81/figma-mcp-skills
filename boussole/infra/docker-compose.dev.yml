# Boussole — environnement de développement (make up).
# Deux Redis logiques (D17) : persistant (sessions + broker Celery) et cache.
#
# Le dev tourne DÉLIBÉRÉMENT avec le même backend de stockage que la
# production (STORAGE_BACKEND=s3, ici MinIO) et avec l'API et le worker Celery
# dans DEUX conteneurs distincts. C'est précisément l'écart inverse — dev
# mono-processus sur disque local — qui avait masqué le fait que l'export RGPD
# (F-Q) répondait 404 en multi-conteneur.
name: boussole

# Environnement commun API / worker : le worker DOIT voir exactement le même
# stockage objet que l'API, sans quoi l'archive d'export est écrite d'un côté
# et relue de l'autre.
x-app-env: &app-env
  ENV: development
  DATABASE_URL: postgresql+asyncpg://boussole:boussole@postgres:5432/boussole
  REDIS_PERSISTENT_URL: redis://redis-persistent:6379/0
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  # mailpit reçoit tout : rien ne sort de la machine en dev.
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Corpus de démonstration (offres FICTIVES, D34).
  FEATURE_SOURCE_DEMO: "true"
  # Stockage objet (D09) — MinIO, comme la prod utilisera S3 UE.
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: boussole-dev
  S3_REGION: eu-west-1
  S3_ACCESS_KEY: boussole-dev
  S3_SECRET_KEY: boussole-dev-secret
  # MinIO sans KES ne sait pas chiffrer côté serveur : SSE désactivée en dev
  # UNIQUEMENT. En staging/production, S3_SSE=aws:kms (+ S3_KMS_KEY_ID) —
  # « none » y est refusé au démarrage (check_storage_configuration).
  S3_SSE: none
  S3_ADDRESSING_STYLE: path
  SESSION_TTL_DAYS: "30"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: boussole
      POSTGRES_PASSWORD: boussole   # dev uniquement — jamais en prod (D23)
      POSTGRES_DB: boussole
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boussole -d boussole"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-persistent:
    image: redis:7-alpine
    # Sessions + broker Celery : AOF, aucune éviction (D17).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-persistent-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    # Cache + rate limiting : LRU, perte acceptable (D17).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: boussole-dev
      MINIO_ROOT_PASSWORD: boussole-dev-secret   # dev uniquement (D23)
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Création du bucket au démarrage : sans lui, le premier upload de CV échoue
  # en NoSuchBucket et l'erreur est difficile à relier à l'infra. Idempotent
  # (--ignore-existing), s'arrête une fois le bucket prêt.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set dev http://minio:9000 boussole-dev boussole-dev-secret &&
        mc mb --ignore-existing dev/boussole-dev &&
        mc version enable dev/boussole-dev &&
        echo "bucket boussole-dev prêt (versionné)"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # UI web
      - "1025:1025"   # SMTP
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      <<: *app-env
      # Proxies de confiance pour X-Forwarded-For (uvicorn --forwarded-allow-ips
      # ET app/main.py::trusted_proxies). Le SEUL front légitime est le
      # conteneur « web » (Next.js), épinglé sur une adresse fixe du réseau
      # ci-dessous — d'où une liste explicite plutôt que "*", qui rendrait
      # l'identité de rate limiting falsifiable par n'importe quel client.
      FORWARDED_ALLOW_IPS: "172.28.0.20"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # /readyz et NON /healthz. `web` démarre sur `condition: service_healthy` :
    # c'est donc une décision de ROUTAGE, pas de vivacité. /healthz répond 200
    # dès que le processus est levé — base injoignable ou migrations non
    # passées comprises — et le front commençait à parler à une API qui ne
    # pouvait pas lui répondre. /readyz vérifie base, Redis persistant et
    # stockage ; ses dépendances sont déjà `service_healthy` ci-dessus, donc
    # rien n'est plus lent, seulement plus juste.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Worker Celery — conteneur SÉPARÉ de l'API, volontairement : c'est la
  # topologie de production. Il partage l'environnement *app-env, donc le même
  # bucket MinIO : l'archive d'export RGPD qu'il écrit est relisible par l'API.
  # Avec STORAGE_BACKEND=local, ce service et l'API auraient deux disques
  # distincts et tout téléchargement d'export répondrait 404.
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - -Q
      - ingestion,ai,scoring,maintenance
      - --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Un worker mort ne fait rien SAVOIR : il ne répond à personne, aucune
    # requête n'échoue, les tâches s'accumulent simplement dans le broker.
    # `inspect ping` interroge le worker par le broker et échoue s'il ne
    # consomme plus — c'est le seul signal disponible de l'extérieur.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ⚠️ SERVICE INDISPENSABLE — pas un confort de développement.
  #
  # Celery beat est le SEUL déclencheur des tâches planifiées. Sans lui, le
  # worker ci-dessus tourne sans rien recevoir : aucune ingestion, aucune
  # expiration d'offre, aucun rattrapage d'embeddings, et surtout AUCUNE
  # PURGE RGPD. `DELETE /account` répondrait 204, la demande serait
  # enregistrée avec son échéance à J+30… et personne ne viendrait jamais
  # l'exécuter. L'engagement « suppression effective sous 30 jours » (D09)
  # serait rompu en silence, sans la moindre erreur dans les journaux.
  #
  # Il était absent de ce fichier : un déploiement calqué dessus héritait du
  # défaut. Une seule instance doit tourner (beat n'est pas concurrent).
  beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command:
      - celery
      - -A
      - app.workers.celery_app
      - beat
      - --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Beat ne répond à AUCUNE sonde : il ne consomme pas de file, il publie.
    # `inspect ping` ne l'atteint donc pas. Son seul signe de vie observable
    # est la fraîcheur de son fichier d'état, qu'il réécrit à chaque
    # échéance. Sans sonde, un beat mort est exactement le scénario décrit
    # ci-dessus — silencieux, et la purge RGPD ne s'exécute plus.
    #
    # Le seuil est large (2 h) : la tâche la moins fréquente du calendrier
    # dicte le rythme d'écriture, et une sonde plus serrée déclarerait mort
    # un ordonnanceur qui n'a simplement rien à faire.
    healthcheck:
      # Chemin lu dans `celery_app.py` (`CELERY_BEAT_SCHEDULE_FILE`, défaut
      # `/tmp/boussole-celerybeat-schedule`). Le motif est glob : le backend
      # `dbm` peut suffixer le fichier (.db, .dir/.dat/.bak selon
      # l'implémentation).
      test: ["CMD-SHELL", "test $$(find /tmp -maxdepth 1 -name 'boussole-celerybeat-schedule*' -mmin -120 | wc -l) -gt 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    # Adresse fixe : c'est CETTE adresse que l'API accepte comme proxy de
    # confiance (FORWARDED_ALLOW_IPS du service api). Sans épinglage, Docker
    # attribue une IP variable et la liste de confiance serait ingérable.
    networks:
      default:
        ipv4_address: 172.28.0.20
    depends_on:
      api:
        condition: service_healthy

# Réseau par défaut du projet, avec un sous-réseau FIXE : indispensable pour
# épingler l'adresse du front et n'accorder la confiance XFF qu'à lui.
networks:
  default:
    name: boussole-dev
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-persistent-data:
  minio-data:
