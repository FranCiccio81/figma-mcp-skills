# Skills CI: quality gates for the skills library.
#
# Runs only first-party scripts from this repository and the official Agent Skills reference
# validator pinned to a reviewed commit. No skill content is executed except the two reviewed
# scripts covered by tests (see skills/.validator.json).

name: skills-ci

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "docs/sources/**"
      - "docs/registry/**"
      - ".claude/skills/**"
      - ".github/workflows/skills-ci.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "docs/sources/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pyyaml>=6,<7" "pytest>=8,<10"
      - name: Gates 1-10 (spec, frontmatter, links, provenance, duplicates, security, licensing, evals, docs)
        run: python scripts/validate_skills.py
      - name: Registry is up to date
        run: python scripts/build_registry.py --check
      - name: Unit and integration tests
        run: python -m pytest -q tests

  spec-reference:
    name: Official skills-ref validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skills-ref (agentskills/agentskills, reviewed commit 83021e2)
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - name: Validate every skill
        run: |
          status=0
          for dir in $(find skills -mindepth 2 -maxdepth 2 -type d ! -name '.*'); do
            skills-ref validate "$dir" || status=1
          done
          exit $status

  links:
    name: External links (scheduled, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6,<7"
      - run: python scripts/check_links.py
